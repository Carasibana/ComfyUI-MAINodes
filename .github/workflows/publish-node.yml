name: Publish to Comfy Registry

# Publishes when pyproject.toml changes on main (i.e. a version bump), and on
# demand. The registry rejects a re-publish of an existing version, so the
# version field is the release switch.
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish custom node        # the action checks out for itself
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.COMFY_REGISTRY }}
