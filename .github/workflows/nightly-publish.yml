name: Nightly Registry Publish

# Batches a day's commits into ONE registry version. Registry versions are
# immutable and permanent, so publishing per-push would leave users scrolling
# through a version per commit.
#
# Self-correcting: it asks the registry what is already published rather than
# assuming. If the version in pyproject.toml was never published, it ships that
# as-is (covers a hand-made release). If it was, and main has moved since, it
# bumps the patch and ships that. If main has not moved, it does nothing.
on:
  schedule:
    - cron: "0 9 * * *"        # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if main has not moved"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Decide whether to publish, and at what version
        id: decide
        run: |
          set -euo pipefail
          CUR=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NAME=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          echo "pyproject version: $CUR"

          PUBLISHED=$(curl -sf "https://api.comfy.org/nodes/$NAME/versions" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);v=d if isinstance(d,list) else d.get('versions',[]);print(' '.join(x.get('version','') for x in v))" || echo "")
          echo "already published: [$PUBLISHED]"

          LAST_TAG=$(git tag --list 'published-*' --sort=-v:refname | head -1)
          MOVED=1
          if [ -n "$LAST_TAG" ] && [ "$(git rev-list -n1 "$LAST_TAG")" = "$(git rev-parse HEAD)" ]; then
            MOVED=0
          fi
          echo "last published tag: ${LAST_TAG:-none} | main moved: $MOVED"

          if ! echo " $PUBLISHED " | grep -q " $CUR "; then
            echo "version=$CUR" >> "$GITHUB_OUTPUT"; echo "bump=no" >> "$GITHUB_OUTPUT"
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "-> $CUR is not on the registry yet; publishing it as-is"
          elif [ "$MOVED" = "1" ] || [ "${{ inputs.force }}" = "true" ]; then
            NEXT=$(python3 -c "p='$CUR'.split('.');p[-1]=str(int(p[-1])+1);print('.'.join(p))")
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"; echo "bump=yes" >> "$GITHUB_OUTPUT"
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "-> main moved since ${LAST_TAG:-the last publish}; bumping $CUR -> $NEXT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "-> nothing to do: $CUR is published and main has not moved"
          fi

      - name: Bump the patch version
        if: steps.decide.outputs.go == 'yes' && steps.decide.outputs.bump == 'yes'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os
          v = os.environ["V"]
          s = open("pyproject.toml").read()
          s = re.sub(r'(?m)^version\s*=\s*".*"$', f'version = "{v}"', s, count=1)
          open("pyproject.toml", "w").write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: v${{ steps.decide.outputs.version }}"
          git push -q origin HEAD:main
        env:
          V: ${{ steps.decide.outputs.version }}

      - name: Publish
        if: steps.decide.outputs.go == 'yes'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.COMFY_REGISTRY }}
          skip_checkout: 'true'

      - name: Mark what was published
        if: steps.decide.outputs.go == 'yes'
        run: |
          git tag -f "published-${{ steps.decide.outputs.version }}"
          git push -qf origin "published-${{ steps.decide.outputs.version }}"
